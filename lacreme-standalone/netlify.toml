[build]
  publish = "."

[[redirects]]
  from = "https://www.lacreme.app/*"
  to = "https://lacreme.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/terms.html"
  to = "/terms/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "https://calculadora-network.netlify.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/lacreme.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/lacrema.html"
  to = "/"
  status = 301
