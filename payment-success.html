<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment verification | El Cameleón</title><style>body{margin:0;font:16px/1.5 Arial,sans-serif;background:#fbf7ef;color:#172033}.card{max-width:680px;margin:10vh auto;padding:32px;background:#fff;border-radius:18px;box-shadow:0 16px 45px #10203918}h1{margin-top:0}.status{padding:14px;border-radius:10px;background:#eef4fb}a{color:#0b8f6f}.small{font-size:13px;color:#687386}</style></head><body><main class="card"><h1>Thanks — we’re verifying your test checkout.</h1><p id="status" class="status">Checking Stripe securely…</p><p>Access is granted only after server-side payment verification. Visiting this page by itself does not unlock Premium Alpha.</p><p><a href="/">Return to El Cameleón</a> · <a href="/billing-terms.html">Billing terms</a> · <a href="/privacy.html">Privacy</a></p><p class="small">Support: <a href="mailto:alexandermichaelwinston@gmail.com">alexandermichaelwinston@gmail.com</a></p></main><script>const s=new URLSearchParams(location.search).get('session_id');const el=document.getElementById('status');if(!s){el.textContent='No checkout session was supplied. No access has been granted.'}else{fetch('/api/checkout-status?session_id='+encodeURIComponent(s),{headers:{accept:'application/json'}}).then(r=>r.json()).then(x=>{el.textContent=x.verified?'Test subscription verified. Fulfillment is being recorded.':'Verification is pending. No paid access has been granted yet.'}).catch(()=>{el.textContent='Verification is pending. No paid access has been granted yet.'})}</script></body></html>
