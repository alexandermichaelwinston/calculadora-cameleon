[build]
  command = "node scripts/enrich-social.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/lacrema.html"
  to = "/lacrema-v2.html"
  status = 200
  force = true

[[redirects]]
  from = "/lacrema-deals"
  to = "/lacrema-deals.html"
  status = 200
  force = true

[[redirects]]
  from = "/asset-tree"
  to = "/asset-tree.html"
  status = 200

[[redirects]]
  from = "/portfolio"
  to = "/asset-tree.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[[headers]]
  for = "/assets/el-cameleon-social.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "image/jpeg"

[[headers]]
  for = "/assets/la-crema-taco-social-final.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "image/jpeg"

