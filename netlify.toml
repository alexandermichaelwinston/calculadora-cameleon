[build]
  command = "node scripts/enrich-social.js && node scripts/prefer-google.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# LaCreme.app is the current publisher website, hosted by the standalone project.
# Keep the shared ecosystem intact and send the former La Creme entry points there.
[[redirects]]
  from = "https://lacreme.app/"
  to = "/lacreme.html"
  status = 200
  force = true

[[redirects]]
  from = "https://www.lacreme.app/"
  to = "https://lacreme.app/"
  status = 301
  force = true

[[redirects]]
  from = "https://lacreme.reviews/"
  to = "https://lacreme.app/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lacreme.reviews/"
  to = "https://lacreme.app/"
  status = 301
  force = true

# Send the exact URL cited in Rakuten's review, and its aliases, to the current website.
[[redirects]]
  from = "/lacrema.html"
  to = "https://lacreme.app/"
  status = 301
  force = true

[[redirects]]
  from = "/lacrema"
  to = "https://lacreme.app/"
  status = 301
  force = true

[[redirects]]
  from = "/lacrema-v2.html"
  to = "https://lacreme.app/"
  status = 301
  force = true

[[redirects]]
  from = "/lacreme"
  to = "https://lacreme.app/"
  status = 301
  force = true

[[redirects]]
  from = "/lacreme.html"
  to = "https://lacreme.app/"
  status = 301
  force = true

[[redirects]]
  from = "/lacrema-deals.html"
  to = "/lacreme-deals.html"
  status = 301
  force = true

[[redirects]]
  from = "/lacrema-deals"
  to = "/lacreme-deals.html"
  status = 301
  force = true

[[redirects]]
  from = "/lacreme-deals"
  to = "/lacreme-deals.html"
  status = 200
  force = true

[[redirects]]
  from = "/lacrema-partners.html"
  to = "/lacreme-partners.html"
  status = 301
  force = true

[[redirects]]
  from = "/lacrema-partners"
  to = "/lacreme-partners.html"
  status = 301
  force = true

[[redirects]]
  from = "/lacreme-partners"
  to = "/lacreme-partners.html"
  status = 200
  force = true

[[redirects]]
  from = "/asset-tree"
  to = "/asset-tree.html"
  status = 200

[[redirects]]
  from = "/portfolio"
  to = "/asset-tree.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[[headers]]
  for = "/assets/el-cameleon-social.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "image/jpeg"

[[headers]]
  for = "/assets/la-creme-houston-social.png"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "image/png"

[[headers]]
  for = "/assets/la-crema-taco-social-final.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "image/jpeg"

